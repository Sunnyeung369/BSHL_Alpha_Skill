[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bshl-alpha"
version = "0.5.1"
description = "Evidence-first market research and explainable trade readiness"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
include = ["bshl*", "scoring*", "data*", "replay*"]

