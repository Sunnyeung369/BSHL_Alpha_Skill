[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bshl-alpha"
version = "0.9.1"
description = "Evidence-first market research and explainable trade readiness"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["jsonschema>=4.23,<5", "PyYAML>=6,<7"]
visual = ["Pillow>=10,<13"]

[project.urls]
Repository = "https://github.com/Sunnyeung369/BSHL_Alpha_Skill"
Issues = "https://github.com/Sunnyeung369/BSHL_Alpha_Skill/issues"

[project.scripts]
bshl = "bshl.cli:main"

[tool.setuptools.package-data]
bshl = ["assets/*.csv", "assets/*.json"]

[tool.setuptools.packages.find]
include = ["bshl*", "scoring*", "data*", "replay*"]

