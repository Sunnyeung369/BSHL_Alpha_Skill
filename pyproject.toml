[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bshl-alpha"
version = "0.7.0"
description = "Evidence-first market research and explainable trade readiness"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["jsonschema>=4.23,<5"]

[project.scripts]
bshl = "bshl.cli:main"

[tool.setuptools.package-data]
bshl = ["assets/*.csv", "assets/*.json"]

[tool.setuptools.packages.find]
include = ["bshl*", "scoring*", "data*", "replay*"]

