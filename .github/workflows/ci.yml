name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repository.py
      - run: python scripts/validate_examples.py
      - run: python scripts/run_demo.py --output outputs/ci-demo
      - run: python -m pip wheel . --no-deps --wheel-dir outputs/wheels
      - run: python scripts/smoke_wheel.py --wheel outputs/wheels/bshl_alpha-0.9.0-py3-none-any.whl

